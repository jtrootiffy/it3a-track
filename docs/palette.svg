<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-label="Palette: #FFFFFF canvas, #41EAD4 accent, #001514 ink">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41EAD4"/>
      <stop offset="1" stop-color="#2BC4B1"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="359" height="95" rx="16" fill="#FFFFFF" stroke="#D9E5E2"/>
  <text x="24" y="58" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="20" font-weight="600" fill="#001514">#FFFFFF</text>
  <text x="24" y="120" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="12" letter-spacing="2.5" fill="#7C9994">CANVAS</text>

  <!-- accent -->
  <rect x="420" y="0" width="360" height="96" rx="16" fill="url(#accent)"/>
  <text x="444" y="58" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="20" font-weight="600" fill="#001514">#41EAD4</text>
  <text x="444" y="120" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="12" letter-spacing="2.5" fill="#7C9994">ACCENT</text>

  <!-- ink -->
  <rect x="840" y="0" width="360" height="96" rx="16" fill="#001514" stroke="#123A35"/>
  <text x="864" y="58" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="20" font-weight="600" fill="#FFFFFF">#001514</text>
  <text x="864" y="120" font-family="'JetBrains Mono', Consolas, 'Segoe UI', monospace" font-size="12" letter-spacing="2.5" fill="#7C9994">INK</text>
</svg>
